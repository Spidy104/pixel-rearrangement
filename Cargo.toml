[package]
name = "pixel-rearrangement"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
default-run = "pixel-rearrangement"
description = "Palette-preserving pixel assignment and animation"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
openh264 = "0.9"
mp4 = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1

[[bin]]
name = "audit"
path = "src/audit.rs"
